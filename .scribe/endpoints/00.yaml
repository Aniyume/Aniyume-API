\" unnaturally warm hands that allow dough to ferment faster, Kazuma''s bread is like a slice of Heaven.<br>\n<br>\nAnd when the Pantasia Rookie Competition arrives, everyone will get a taste of his skill! Along with his friend Kawachi (who''s only in it for the dough), he\u2019ll go up against koala karate masters, Harvard bread scientists, samurai with rolling-pin swords, and more! Can Kazuma create bread like naan other and bake his way to glory, or should he quit before he''s toast?<br>\n<br>\n(Source: Right Stuf)","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx28-QuKcZpUjTXzV.png","rating":"7.60","year":2004,"status":"finished","type":"tv","number_of_episodes":69,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":18755,"favorites":300,"external_id":"28","external_source":"anilist","tags":[{"id":8,"name":"Ensemble Cast","slug":"ensemble-cast"},{"id":16,"name":"Male Protagonist","slug":"male-protagonist"},{"id":41,"name":"Comedy","slug":"comedy"},{"id":46,"name":"Shounen","slug":"shounen"},{"id":56,"name":"Magic","slug":"magic"},{"id":126,"name":"Food","slug":"food"},{"id":142,"name":"Time Manipulation","slug":"time-manipulation"},{"id":153,"name":"Parody","slug":"parody"},{"id":170,"name":"Meta","slug":"meta"},{"id":171,"name":"Surreal Comedy","slug":"surreal-comedy"},{"id":172,"name":"Isekai","slug":"isekai"},{"id":173,"name":"Educational","slug":"educational"}],"created_at":"2026-01-01T09:33:53.000000Z","updated_at":"2026-01-01T10:23:05.000000Z"},{"id":21,"title":"Zipang","slug":"zipang-29","description":"Mirai, an improved Kongou-class Aegis guided missile destroyer, is one of the newest and most advanced ships in the entire Japanese Self Defense Force (SDF). Her crew, also one of the newest, is lead by Capt. Umezu Saburo and Executive Officer Kadomatsu Yosuke. While running scheduled training exercises one day, Mirai encounters a fierce storm that throws their navigation systems into temporary disarray. After a few minutes of recovery, the crew is shocked to discover that they''ve been transported back in time to June 4, 1942&mdash;The Battle of Midway, during World War II. Letting history take its course for this battle, they manage to avoid the conflict firsthand and make a vow to remain annonymous, changing history as little as possible. However, when the crew comes across the dying Lt. Commander Kusaka Takumi, XO. Kadomatsu''s instincts to save lives takes over, changing the course of history more than he could''ve imagined.\n<br><br>\n(Source: Anime News Network)","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx29-0PsnJVadMG7k.jpg","rating":"7.10","year":2004,"status":"finished","type":"tv","number_of_episodes":26,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":6052,"favorites":64,"external_id":"29","external_source":"anilist","tags":[{"id":1,"name":"Action","slug":"action"},{"id":4,"name":"Sci-Fi","slug":"sci-fi"},{"id":9,"name":"Primarily Adult Cast","slug":"primarily-adult-cast"},{"id":10,"name":"Tragedy","slug":"tragedy"},{"id":11,"name":"Travel","slug":"travel"},{"id":40,"name":"Military","slug":"military"},{"id":67,"name":"Primarily Male Cast","slug":"primarily-male-cast"},{"id":82,"name":"Seinen","slug":"seinen"},{"id":95,"name":"Historical","slug":"historical"},{"id":107,"name":"Anachronism","slug":"anachronism"},{"id":117,"name":"Ships","slug":"ships"},{"id":118,"name":"War","slug":"war"},{"id":142,"name":"Time Manipulation","slug":"time-manipulation"}],"created_at":"2026-01-01T09:33:53.000000Z","updated_at":"2026-01-01T10:23:05.000000Z"}],"links":{"first":"https:\/\/leanna-superurgent-unfearfully.ngrok-free.dev\/api\/v1\/public\/anime?page=1","last":"https:\/\/leanna-superurgent-unfearfully.ngrok-free.dev\/api\/v1\/public\/anime?page=1094","prev":null,"next":"https:\/\/leanna-superurgent-unfearfully.ngrok-free.dev\/api\/v1\/public\/anime?page=2"},"meta":{"current_page":1,"from":1,"last_page":1094