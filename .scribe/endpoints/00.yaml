throughout the world. His last words before his death revealed the location of the greatest treasure in the world, One Piece. It was this revelation that brought about the Grand Age of Pirates, men who dreamed of finding One Piece (which promises an unlimited amount of riches and fame), and quite possibly the most coveted of titles for the person who found it, the title of the Pirate King.<br><br>\nEnter Monkey D. Luffy, a 17-year-old boy that defies your standard definition of a pirate. Rather than the popular persona of a wicked, hardened, toothless pirate who ransacks villages for fun, Luffy\u2019s reason for being a pirate is one of pure wonder; the thought of an exciting adventure and meeting new and intriguing people, along with finding One Piece, are his reasons of becoming a pirate. Following in the footsteps of his childhood hero, Luffy and his crew travel across the Grand Line, experiencing crazy adventures, unveiling dark mysteries and battling strong enemies, all in order to reach One Piece.<br><br>\n<b>*This includes following special episodes:<\/b><br>\n- Chopperman to the Rescue! Protect the TV Station by the Shore! (Episode 336)<br>\n- The Strongest Tag-Team! Luffy and Toriko''s Hard Struggle! (Episode 492)<br>\n- Team Formation! Save Chopper (Episode 542)<br>\n- History''s Strongest Collaboration vs. Glutton of the Sea (Episode 590)<br>\n- 20th Anniversary! Special Romance Dawn (Episode 907)","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx21-ELSYx3yMPcKM.jpg","rating":"1.00","year":1999,"status":"releasing","type":"tv","number_of_episodes":0,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":650614,"favorites":90798,"external_id":"21","external_source":"anilist","tags":[{"id":1,"name":"Action","slug":"action"},{"id":2,"name":"Drama","slug":"drama"},{"id":3,"name":"Fantasy","slug":"fantasy"},{"id":6,"name":"Revenge","slug":"revenge"},{"id":8,"name":"Tragedy","slug":"tragedy"},{"id":9,"name":"Post-