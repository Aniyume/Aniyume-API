He believes if he could also follow his father''s path, he could one day reunite with him.<br><br>\nAfter becoming 12, Gon leaves his home and takes on the task of entering the Hunter exam, notorious for its low success rate and high probability of death to become an official Hunter. He befriends the revenge-driven Kurapika, the doctor-to-be Leorio and the rebellious ex-assassin Killua in the exam, with their friendship prevailing throughout the many trials and threats they come upon taking on the dangerous career of a Hunter.","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx11061-y5gsT1hoHuHw.png","rating":"8.90","year":2011,"status":"finished","type":"tv","number_of_episodes":148,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":750669,"favorites":71118,"external_id":"11061","external_source":"anilist","tags":[{"id":1,"name":"Action","slug":"action"},{"id":3,"name":"Fantasy","slug":"fantasy"},{"id":6,"name":"Revenge","slug":"revenge"},{"id":8,"name":"Tragedy","slug":"tragedy"},{"id":10,"name":"Primarily Teen Cast","slug":"primarily-teen-cast"},{"id":11,"name":"Super Power","slug":"super-power"},{"id":12,"name":"Male Protagonist","slug":"male-protagonist"},{"id":20,"name":"Ensemble Cast","slug":"ensemble-cast"},{"id":25,"name":"Shounen","slug":"shounen"},{"id":26,"name":"Coming of Age","slug":"coming-of-age"},{"id":34,"name":"Primarily Male Cast","slug":"primarily-male-cast"},{"id":37,"name":"Adventure","slug":"adventure"},{"id":41,"name":"Travel","slug":"travel"},{"id":46,"name":"Body Horror","slug":"body-horror"},{"id":50,"name":"Animals","slug":"animals"},{"id":54,"name":"Crime","slug":"crime"},{"id":56,"name":"Anti-Hero","slug":"anti-hero"},{"id":59,"name":"Philosophy","slug":"philosophy"},{"id":62,"name":"Urban Fantasy","slug":"urban-fantasy"},{"id":65,"name":"Yandere","slug":"yandere"},{"id":68,"name":"Assassins","slug":"assassins"},{"id":75,"name":"Martial Arts","slug":"martial-arts"},{"id":78,"name":"Ant