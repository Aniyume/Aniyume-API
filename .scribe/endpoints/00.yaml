e":"Drama","slug":"drama"},{"id":9,"name":"Primarily Adult Cast","slug":"primarily-adult-cast"},{"id":12,"name":"Noir","slug":"noir"},{"id":20,"name":"Female Protagonist","slug":"female-protagonist"},{"id":30,"name":"Police","slug":"police"},{"id":37,"name":"Mystery","slug":"mystery"},{"id":42,"name":"Fugitive","slug":"fugitive"},{"id":54,"name":"Supernatural","slug":"supernatural"},{"id":55,"name":"Conspiracy","slug":"conspiracy"},{"id":56,"name":"Magic","slug":"magic"},{"id":57,"name":"Urban Fantasy","slug":"urban-fantasy"},{"id":58,"name":"Witch","slug":"witch"},{"id":59,"name":"Bar","slug":"bar"},{"id":60,"name":"Kuudere","slug":"kuudere"}],"created_at":"2026-01-01T09:33:52.000000Z","updated_at":"2026-01-01T10:23:05.000000Z"},{"id":6,"title":"Beet the Vandel Buster","slug":"beet-the-vandel-buster-8","description":"It is the dark century and the people are suffering under the rule of the devil, Vandel, who is able to manipulate monsters. The Vandel Busters are a group of people who hunt these devils, and among them, the Zenon Squad is known to be the strongest busters on the continent. A young boy, Beet, dreams of joining the Zenon Squad. However, one day, as a result of Beet''s fault, the Zenon squad was defeated by the devil, Beltose. The five dying busters sacrificed their life power into their five weapons, Saiga. After giving their weapons to Beet, they passed away. Years have passed since then and the young Vandel Buster, Beet, begins his adventure to carry out the Zenon Squad''s will to put an end to the dark century. ","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/medium\/b8-ReS3TwSgrDDi.jpg","rating":"6.60","year":2004,"status":"finished","type":"tv","number_of_episodes":52,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":2932,"favorites":38,"external_id":"8","external_source":"anilist","tags":[{"id":2,"name":"Adventure","slug":"adventure"},{"id":46,"name":"Shounen","slug":"shounen"},{"id":54,"name":"Supernatural","slug":"supernatural"},{"id":61,"name":"Fantasy","slug":"fantasy"},{"id":62,"name":"Spearplay","slug":"spearplay"},{"id":63,"name":"Swordplay","slug":"swordplay"}],"created_at":"2026-01-01T09:33:52.000000Z","updated_at":"2026-01-01T10:23:05.000000Z"},{"id":7,"title":"Eyeshield 21","slug":"eyeshield-21-15","description":"Welcome To the Gridiron of the Damned!   Huge hulking bodies throw themselves at each other, while a tiny lithe body runs between them for the goal!  No, it&rsquo;s not a game of football, it&rsquo;s Sena Kobayakawa trying to evade the monstrous Ha-Ha brothers down the halls of Deimon High School!  But wait!  Sena&rsquo;s incredible skills at not getting caught have been spotted by the devilish (possibly actually demonic) captain of the school&rsquo;s embryonic American style football team, and when Sena asks to be the teams manager, he gets  thrust onto the field as a running back instead!  But there are two BIG catches: first, to keep the identity of their new &ldquo;star&rdquo; player an absolute secret, Yoichi makes Sena wear an opaque visor on his helmet and gives him the alias of &ldquo;Eyeshield 21.&rdquo;  And the second catch?  Well, in order to hit his fastest &ldquo;speed of light&rdquo; running mode, Sena usually has to be absolutely terrified. Not that THAT will be a problem with the monstrous players that he&rsquo;ll soon find himself running from!  The insanity hits the streets when the feet meet the cleats in EYESHIELD 21! <br><br>\n(Source: Sentai Filmworks)","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx15-A4F2t0TgWoi4.png","rating":"7.60","year":2005,"status":"finished","type":"tv","number_of_episodes":145,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":31507,"favorites":704,"external_id":"15","external_source":"anilist","tags":[{"id":1,"name":"Action","slug":"action"},{"id":10,"name":"Tragedy","slug":"tragedy"},{"id":16,"name":"Male Protagonist","slug":"male-protago