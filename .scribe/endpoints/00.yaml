desperate sacrifice of Edward''s right arm that he is able to affix Alphonse''s soul to a suit of armor. Devastated and alone, it is the hope that they would both eventually return to their original bodies that gives Edward the inspiration to obtain metal limbs called \"automail\" and become a state alchemist, the Fullmetal Alchemist.\n<br><br>\nThree years of searching later, the brothers seek the Philosopher''s Stone, a mythical relic that allows an alchemist to overcome the Law of Equivalent Exchange. Even with military allies Colonel Roy Mustang, Lieutenant Riza Hawkeye, and Lieutenant Colonel Maes Hughes on their side, the brothers find themselves caught up in a nationwide conspiracy that leads them not only to the true nature of the elusive Philosopher''s Stone, but their country''s murky history as well. In between finding a serial killer and racing against time, Edward and Alphonse must ask themselves if what they are doing will make them human again... or take away their humanity.\n<br><br>\n(Source: MAL Rewrite)","poster_url":"https:\/\/s4.anilist.co\/file\/anilistcdn\/media\/anime\/cover\/large\/bx5114-nSWCgQlmOMtj.jpg","rating":"9.00","year":2009,"status":"finished","type":"tv","number_of_episodes":64,"aired_from":null,"aired_to":null,"nsfw_flag":false,"popularity":648152,"favorites":53564,"external_id":"5114","external_source":"anilist","tags":[{"id":1,"name":"Action","slug":"action"},{"id":2,"name":"Drama","slug":"drama"},{"id":3,"name":"Fantasy","slug":"fantasy"},{"id":6,"name":"Revenge","slug":"revenge"},{"id":7,"name":"Military","slug":"military"},{"id":8,"name":"Tragedy","slug":"tragedy"},{"id":11,"name":"Super Power","slug":"super-power"},{"id":12,"name":"Male Protagonist","slug":"male-protagonist"},{"id":14,"name":"Gore","slug":"gore"},{"id":15,"name":"Swordplay","slug":"swordplay"},{"id":17,"name":"Steampunk","slug":"steampunk"},{"id":19,"name":"Vore","slug":"vore"},{"id":20,"name":"Ensemble Cast","slug":"ensemble-cast"},{"id":23,"name":"Canniba