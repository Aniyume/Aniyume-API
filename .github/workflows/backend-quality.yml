name: Backend CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "release"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite

      - name: Run tests
        run: php artisan test

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan/Larastan
        run: composer analyse

  image-smoke:
    name: Backend image build smoke
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'pull_request' || github.base_ref == 'dev' || github.base_ref == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build --target prod-like -t aniyume-api:${{ github.sha }} .
